<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Warrigal Park FC | Team Management</title>
    <link rel="stylesheet" href="style.css">
    <style>
      /* =========================================================
        TEAM MANAGEMENT PAGE
        ========================================================= */

      .management-section {
        margin-top: 2rem;
        padding: 1.5rem;

        background: #ffffff;
        border: 1px solid #d9e0e7;
        border-radius: 10px;
      }


      /* =========================================================
        SECTION HEADER
        ========================================================= */

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;

        gap: 2rem;
        margin-bottom: 1.5rem;
      }

      .section-header > div:first-child {
        min-width: 0;
      }

      .section-header .eyebrow {
        margin: 0 0 0.35rem;
        padding: 0;

        background: none;

        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #555;
      }

      .section-header h2 {
        margin: 0;

        font-size: 1.5rem;
        line-height: 1.2;
        color: #17324d;
      }


      /* =========================================================
        SEASON + AGE GROUP FILTERS
        ========================================================= */

      .team-filters {
        display: flex;
        align-items: flex-end;

        gap: 0.75rem;
        flex-shrink: 0;
      }

      .team-filters .filter-group {
        display: flex;
        flex-direction: column;

        gap: 0.35rem;
        width: 145px;
      }

      .team-filters .filter-group label {
        margin: 0;

        font-size: 0.85rem;
        font-weight: 600;
        color: #17324d;
      }

      .team-filters .filter-group select {
        width: 100%;
        height: 44px;

        box-sizing: border-box;
        padding: 0 0.75rem;

        border: 1px solid #c8d2dc;
        border-radius: 6px;

        background: #ffffff;
        color: #17324d;

        font-size: 0.95rem;
      }


      /* =========================================================
        TEAM LIST
        ========================================================= */

      .management-list {
        display: flex;
        flex-direction: column;

        gap: 1rem;
        min-height: 0;
      }


      /* =========================================================
        TEAM CARD
        ========================================================= */

      .management-list .list-item {
        display: flex;
        justify-content: space-between;
        align-items: center;

        gap: 2rem;

        padding: 1.25rem;

        border: 1px solid #d9e0e7;
        border-radius: 8px;

        background: #ffffff;
      }

      .management-list .list-item h3 {
        margin: 0.25rem 0 0.5rem;
      }

      .management-list .list-item p {
        margin: 0.35rem 0;
      }


      /* =========================================================
        TEAM ACTION BUTTONS
        ========================================================= */

      .team-actions {
        display: flex;
        align-items: center;

        gap: 0.6rem;
        flex-shrink: 0;
        flex-wrap: wrap;
      }


      /* View roster link */

      .team-actions .view-roster {
        display: inline-flex;

        align-items: center;
        justify-content: center;

        min-height: 42px;
        padding: 0 1rem;

        box-sizing: border-box;

        border: 1px solid #c8d2dc;
        border-radius: 6px;

        background: #ffffff;
        color: #17324d;

        font-size: 0.95rem;
        font-weight: 600;

        text-decoration: none;
      }

      .team-actions .view-roster:hover {
        background: #f4f7f9;
        text-decoration: none;
      }


      /* Rename / Remove */

      .team-actions .secondary-button {
        min-height: 42px;
      }


      /* =========================================================
        EMPTY STATE
        ========================================================= */

      .management-list .empty-state {
        margin: 0;

        padding: 2rem 1rem;

        text-align: center;

        color: #587086;
      }


      /* =========================================================
        RESPONSIVE
        ========================================================= */

      @media (max-width: 760px) {

        .section-header {
          flex-direction: column;
          align-items: stretch;

          gap: 1rem;
        }


        .team-filters {
          width: 100%;
        }


        .team-filters .filter-group {
          flex: 1;
          width: auto;
        }


        .management-list .list-item {
          flex-direction: column;
          align-items: stretch;

          gap: 1rem;
        }


        .team-actions {
          justify-content: flex-start;
        }

      }

      </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#top">WPFC<span>Admin</span></a>

        <nav>
          <a class="nav-group-link" href="../index.html">Dashboard</a>

          <button class="nav-group-toggle" type="button" aria-expanded="true" aria-controls="member-management-menu">
            Member Management
          </button>
          <div id="member-management-menu" class="nav-submenu">
            <a class="nav-subitem" href="../member/index.html">Add New Member</a>
            <a class="nav-subitem" href="../member/search.html">Search Members</a>
          </div>

          <button class="nav-group-toggle" type="button" aria-expanded="true" aria-controls="guardian-management-menu">
            Guardian Management
          </button>
          <div id="guardian-management-menu" class="nav-submenu">
            <a class="nav-subitem" href="../guardian/index.html">Add Guardian</a>
            <a class="nav-subitem" href="../guardian/search.html">Search Guardians</a>
          </div>

          <button class="nav-group-toggle" type="button" aria-expanded="true" aria-controls="registration-management-menu">
            Registration Management
          </button>
          <div id="registration-management-menu" class="nav-submenu">
            <a class="nav-subitem" href="../registration/index.html">Manage Registrations</a>
          </div>

          <button class="nav-group-toggle" type="button" aria-expanded="true" aria-controls="team-management-menu">
            Team Management
          </button>
          <div id="team-management-menu" class="nav-submenu">
            <a class="nav-subitem active" href="team.html">Manage Team</a>
          </div>
          <button class="nav-group-toggle" type="button" aria-expanded="true" aria-controls="roster-management-menu">
            Roster Management
          </button>
          <div id="team-management-menu" class="nav-submenu">
            <a class="nav-subitem" href="../roster/roster.html" aria-current="page">Manage Roster</a>
          </div>
        </nav>
      </aside>

      <main id="top" class="main-content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Warrigal Park Football Club</p>
            <h1>Team Management</h1>
          </div>
          <div class="user-label">Junior Coordinator</div>
        </header>

        <div class="page-grid">
          <section class="panel form-panel" aria-labelledby="create-team-heading">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">Team Management</p>
                <h2 id="create-team-heading">Create team</h2>
              </div>
            </div>

            <form id="create-team-form">
              <div class="field-grid two-columns">
                <div class="field">
                  <label for="team-name">Team name <span aria-hidden="true">*</span></label>
                  <input id="team-name" name="name" type="text" required>
                </div>

                <div class="field">
                  <label for="team-season">Season <span aria-hidden="true">*</span></label>
                  <input id="team-season" name="season" type="number" min="1950" max="2100" value="2026" required>
                </div>
              </div>

              <div class="field-grid two-columns">
                <div class="field">
                  <label for="team-age-group">Age group <span aria-hidden="true">*</span></label>
                  <select id="team-age-group" name="ageGroup" required>
                    <option value="" selected>Select age group</option>
                    <option value="U6">U6</option>
                    <option value="U7">U7</option>
                    <option value="U8">U8</option>
                    <option value="U9">U9</option>
                    <option value="U10">U10</option>
                    <option value="U11">U11</option>
                    <option value="U12">U12</option>
                    <option value="U13">U13</option>
                    <option value="U14">U14</option>
                    <option value="U15">U15</option>
                    <option value="U16">U16</option>
                    <option value="U17">U17</option>
                    <option value="U18">U18</option>
                    <option value="Senior">Senior</option>
                  </select>
                </div>

                <div class="field">
                  <label for="team-gender">Gender <span aria-hidden="true">*</span></label>
                  <select id="team-gender" name="gender" required>
                    <option value="" selected>Select gender</option>
                    <option value="Female">Female</option>
                    <option value="Male">Male</option>
                    <option value="Mixed">Mixed</option>
                  </select>
                </div>
              </div>

              <p id="team-form-message" class="form-message" aria-live="polite"></p>

              <div class="form-actions">
                <button class="secondary-button" type="reset">Clear form</button>
                <button class="primary-button" type="submit">Create team</button>
              </div>
            </form>
          </section>

         <section class="management-section">
          <div class="section-header">
            <div>
              <p class="eyebrow">CURRENT TEAMS</p>
              <h2>Teams</h2>
            </div>

            <div class="team-filters">
              <div class="filter-group">
                <label for="season-filter">Season</label>
                <select id="season-filter">
                  <option value="all">All seasons</option>
                </select>
              </div>
              <div class="filter-group">
                <label for="age-group-filter">Age Group</label>
                <select id="age-group-filter">
                  <option value="all">All age groups</option>
                </select>
              </div>
            </div>
          </div>

          <div id="team-list" class="management-list">
            <!-- Teams are loaded by team.js -->
          </div>
        </section>
        </div>
      </main>
    </div>

    <script src="mockdata.js"></script>
    <script src="../data.js"></script>
    <script src="team.js"></script>
  </body>
</html>
