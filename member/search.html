<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Warrigal Park FC | Member Search</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="index.html">WPFC<span>Admin</span></a>
        <nav>
          <a class="nav-group-link" href="../index.html">Dashboard</a>
          <button class="nav-group-toggle" type="button" aria-expanded="true" aria-controls="member-management-menu">
            Member Management
          </button>
          <div id="member-management-menu" class="nav-submenu">
            <a class="nav-subitem" href="index.html">Add New Member</a>
            <a class="nav-subitem active" href="search.html" aria-current="page">Search Members</a>
          </div>
        </nav>
      </aside>

      <main id="member-search-page" class="main-content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Warrigal Park Football Club</p>
            <h1>Member Search</h1>
          </div>
          <div class="user-label">Registrar</div>
        </header>

        <section class="summary-card" aria-label="Member summary">
          <div class="summary-icon" aria-hidden="true">M</div>
          <div>
            <p>Total Members</p>
            <strong id="total-members">0</strong>
          </div>
        </section>

        <div class="content-grid">
          <section class="panel directory-panel" aria-labelledby="directory-heading">
            <div class="directory-heading">
              <div>
                <p class="eyebrow">Records</p>
                <h2 id="directory-heading">Search members</h2>
              </div>
              <label class="search-field" for="member-search">
                <span class="visually-hidden">Search members by name</span>
                <span aria-hidden="true">⌕</span>
                <input id="member-search" type="search" placeholder="Search by name" autocomplete="off">
              </label>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th scope="col">Member</th>
                    <th scope="col">Date of birth</th>
                    <th scope="col">Phone</th>
                    <th scope="col">Email</th>
                    <th scope="col">Status</th>
                  </tr>
                </thead>
                <tbody id="member-list"></tbody>
              </table>
            </div>
          </section>

          <aside class="panel details-panel" aria-labelledby="details-heading">
            <p class="eyebrow">Selected record</p>
            <h2 id="details-heading">Member details</h2>
            <div id="member-details" class="member-details">
              <p>Select a member from the search results to read their details.</p>
            </div>
          </aside>
        </div>
      </main>
    </div>

    <script src="../team/mockdata.js"></script>
    <script src="../data.js"></script>
    <script src="member.js"></script>
  </body>
</html>
